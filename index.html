<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To my dearest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
            background: #000;
            transition: background-color 1s ease;
        }
        body.light-bg {
            background: #ffd6e7;
        }

        .black-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            transition: transform 1.2s ease-in-out;
        }

        .game-photo {
            width: 85%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.2);
        }

        .avatar-heart-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .avatar-wrap {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .avatar-wrap.left {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .avatar-wrap.right {
            border-color: #87ceeb;
            box-shadow: 0 0 30px rgba(135, 206, 235, 0.5);
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heart-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 310px;
            z-index: 0;
            pointer-events: none;
            overflow: visible;
        }
        .heart-path {
            fill: none;
            stroke: #ffd6e7;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.9));
        }

        .hold-btn-wrap {
            position: relative;
            margin-top: 12px;
            border-radius: 50px;
            overflow: hidden;
            width: 180px;
            height: 52px;
        }
        .btn-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50px;
            animation: breathe 2s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 105, 180, 0.4); }
            50% { box-shadow: 0 0 28px rgba(255, 105, 180, 0.9); }
        }
        .hold-btn-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ff69b4;
            border-radius: 50px;
            z-index: 1;
            transition: width 0.1s linear;
        }
        .hold-btn {
            position: relative;
            z-index: 2;
            width: 180px;
            height: 52px;
            border: 2px solid #ff69b4;
            background: transparent;
            color: #ff69b4;
            font-size: 17px;
            border-radius: 50px;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        .slide-up {
            transform: translateY(-100%);
        }

        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d14787;
            font-size: 24px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.8s ease 0.5s;
            pointer-events: none;
        }
        .main-page.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="black-wrap" id="blackWrap">

        <img src="合照.jpg" alt="合照" class="game-photo">

        <div class="avatar-heart-box">
            <div class="avatar-wrap left">
                <img src="左情头.jpg" alt="左边情头" class="avatar">
            </div>

            <svg class="heart-svg" viewBox="-45 -15 330 260">
                <path class="heart-path" id="pathLeft"
                      d="M 120 60 C 60 0, -15 20, -15 80 C -15 145, 50 180, 120 215" />
                <path class="heart-path" id="pathRight"
                      d="M 120 60 C 180 0, 255 20, 255 80 C 255 145, 190 180, 120 215" />
            </svg>

            <div class="avatar-wrap right">
                <img src="右情头.jpg" alt="右边情头" class="avatar">
            </div>
        </div>

        <div class="hold-btn-wrap">
            <div class="btn-glow"></div>
            <div class="hold-btn-fill" id="btnFill"></div>
            <button class="hold-btn" id="holdBtn">长按进入</button>
        </div>
    </div>

    <div class="main-page" id="mainPage">
        ✨
    </div>

    <script>
        const holdBtn = document.getElementById('holdBtn');
        const btnFill = document.getElementById('btnFill');
        const blackWrap = document.getElementById('blackWrap');
        const mainPage = document.getElementById('mainPage');
        const pathLeft = document.getElementById('pathLeft');
        const pathRight = document.getElementById('pathRight');

        const lenLeft = pathLeft.getTotalLength();
        const lenRight = pathRight.getTotalLength();
        pathLeft.style.strokeDasharray = lenLeft;
        pathLeft.style.strokeDashoffset = lenLeft;
        pathRight.style.strokeDasharray = lenRight;
        pathRight.style.strokeDashoffset = lenRight;

        let progress = 0;
        const holdDuration = 2000;
        let isHolding = false;
        let isCompleted = false;

        function startHold() {
            if (isCompleted) return;
            isHolding = true;
            const startTime = Date.now();
            const startProgress = progress;

            function animate() {
                if (!isHolding) {
                    progress = Math.max(0, progress - 0.025);
                    updateAll();
                    if (progress > 0) requestAnimationFrame(animate);
                    return;
                }
                const elapsed = Date.now() - startTime;
                progress = Math.min(1, startProgress + elapsed / holdDuration);
                updateAll();
                if (progress >= 1) {
                    isCompleted = true;
                    enterMain();
                    return;
                }
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }

        function endHold() {
            isHolding = false;
        }

        function updateAll() {
            pathLeft.style.strokeDashoffset = lenLeft * (1 - progress);
            pathRight.style.strokeDashoffset = lenRight * (1 - progress);
            btnFill.style.width = (progress * 100) + '%';
            holdBtn.style.color = progress > 0.5 ? '#fff' : '#ff69b4';
        }

        function enterMain() {
            document.body.classList.add('light-bg');
            setTimeout(() => {
                blackWrap.classList.add('slide-up');
                mainPage.classList.add('show');
            }, 300);
        }

        holdBtn.addEventListener('mousedown', startHold);
        holdBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startHold();
        });
        document.addEventListener('mouseup', endHold);
        document.addEventListener('touchend', endHold);
        document.addEventListener('mouseleave', endHold);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To my dearest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
            background: #000;
            transition: background-color 1.2s ease;
        }
        body.light-bg { background: #ffd6e7; }

        .landing {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px; padding: 40px 20px;
            transition: transform 1.2s ease-in-out;
        }
        .game-photo {
            width: 85%; max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(255,105,180,0.2);
        }
        .avatar-heart-box {
            position: relative;
            width: 100%; max-width: 500px;
            height: 260px;
            display: flex; justify-content: center;
            align-items: center; gap: 40px;
        }
        .avatar-wrap {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 4px solid;
            overflow: hidden;
            position: relative; z-index: 2;
        }
        .avatar-wrap.left {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }
        .avatar-wrap.right {
            border-color: #87ceeb;
            box-shadow: 0 0 30px rgba(135,206,235,0.5);
        }
        .avatar { width: 100%; height: 100%; object-fit: cover; }

        .heart-svg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 350px; height: 310px;
            z-index: 0; pointer-events: none; overflow: visible;
        }
        .heart-path {
            fill: none; stroke: #ffd6e7; stroke-width: 4;
            stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255,105,180,0.9));
        }

        .hold-btn-wrap {
            position: relative; margin-top: 12px;
            border-radius: 50px; overflow: hidden;
            width: 180px; height: 52px;
        }
        .btn-glow {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50px;
            animation: breathe 2s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes breathe {
            0%,100% { box-shadow: 0 0 10px rgba(255,105,180,0.4); }
            50% { box-shadow: 0 0 28px rgba(255,105,180,0.9); }
        }
        .hold-btn-fill {
            position: absolute; top: 0; left: 0;
            height: 100%; width: 0%;
            background: #ff69b4;
            border-radius: 50px;
            z-index: 1; transition: width 0.1s linear;
        }
        .hold-btn {
            position: relative; z-index: 2;
            width: 180px; height: 52px;
            border: 2px solid #ff69b4;
            background: transparent; color: #ff69b4;
            font-size: 17px; border-radius: 50px;
            cursor: pointer; user-select: none;
            transition: color 0.3s ease;
        }

        .main-area {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        .main-area.active {
            opacity: 1; pointer-events: auto;
        }

        .danmaku-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 2.5s ease;
        }
        .danmaku-layer.visible { opacity: 1; }

        .danmaku-track {
            position: absolute;
            display: flex; gap: 20px;
            white-space: nowrap;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .card {
            flex-shrink: 0;
            padding: 12px 20px; border-radius: 18px;
            font-size: 14px;
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 16px rgba(0,0,0,0.15);
            max-width: 280px;
            white-space: normal; word-break: break-word;
            line-height: 1.6;
            animation: floatCard 3s ease-in-out infinite;
        }
        .card.her {
            background: rgba(255,240,180,0.50);
            border: 1px solid rgba(255,215,0,0.3);
            color: #7a5a10;
        }
        .card.him {
            background: rgba(180,210,255,0.50);
            border: 1px solid rgba(135,180,235,0.3);
            color: #1a3a5c;
        }
        @keyframes floatCard {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .track-1 { animation-duration: 65s; }
        .track-2 { animation-duration: 80s; }
        .track-3 { animation-duration: 72s; }
        .track-4 { animation-duration: 88s; }
        .track-5 { animation-duration: 60s; }
        .track-6 { animation-duration: 76s; }
        .track-7 { animation-duration: 84s; }
        .track-8 { animation-duration: 68s; }

        @keyframes scrollLeft { from { transform: translateX(-50%); } to { transform: translateX(0%); } }
        @keyframes scrollRight { from { transform: translateX(0%); } to { transform: translateX(-50%); } }
        .track-left { animation-name: scrollLeft; }
        .track-right { animation-name: scrollRight; }

        .center-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 6;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        .welcome-text {
            color: #d14787;
            font-size: 24px; letter-spacing: 4px;
            transition: opacity 1.5s ease;
            margin-bottom: 30px;
        }
        .welcome-text.hidden { opacity: 0; }

        .password-box {
            opacity: 0;
            transition: opacity 1.5s ease;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            pointer-events: none;
        }
        .password-box.visible {
            opacity: 1; pointer-events: auto;
        }
        .password-box .hint {
            color: rgba(210,71,135,0.7);
            font-size: 14px; letter-spacing: 2px;
        }
        .digit-row {
            display: flex; align-items: center; gap: 4px;
        }
        .digit-prefix {
            color: #d14787;
            font-size: 30px; font-weight: bold;
            font-family: "Courier New", monospace;
        }
        .digit-input {
            width: 44px; height: 50px;
            background: rgba(255,255,255,0.30);
            border: 2px solid rgba(210,71,135,0.4);
            border-radius: 12px;
            color: #d14787;
            font-size: 26px; font-weight: bold;
            text-align: center;
            outline: none;
            backdrop-filter: blur(6px);
            transition: border-color 0.3s;
            caret-color: #d14787;
            font-family: "Courier New", monospace;
        }
        .digit-input:focus {
            border-color: #d14787;
            box-shadow: 0 0 12px rgba(210,71,135,0.25);
        }
        .password-box .error {
            color: #e07080; font-size: 12px;
            opacity: 0; transition: opacity 0.3s;
            letter-spacing: 1px;
        }
        .password-box .error.show { opacity: 1; }

        .slide-up { transform: translateY(-100%); }
    </style>
</head>
<body>

    <div class="landing" id="landing">
        <img src="合照.jpg" alt="合照" class="game-photo">
        <div class="avatar-heart-box">
            <div class="avatar-wrap left">
                <img src="左情头.jpg" alt="左边情头" class="avatar">
            </div>
            <svg class="heart-svg" viewBox="-45 -15 330 260">
                <path class="heart-path" id="pathLeft"
                      d="M 120 60 C 60 0, -15 20, -15 80 C -15 145, 50 180, 120 215" />
                <path class="heart-path" id="pathRight"
                      d="M 120 60 C 180 0, 255 20, 255 80 C 255 145, 190 180, 120 215" />
            </svg>
            <div class="avatar-wrap right">
                <img src="右情头.jpg" alt="右边情头" class="avatar">
            </div>
        </div>
        <div class="hold-btn-wrap">
            <div class="btn-glow"></div>
            <div class="hold-btn-fill" id="btnFill"></div>
            <button class="hold-btn" id="holdBtn">长按进入</button>
        </div>
    </div>

    <div class="danmaku-layer" id="danmakuLayer"></div>

    <div class="main-area" id="mainArea">
        <div class="center-overlay">
            <div class="welcome-text" id="welcomeText">欢迎来到我们的小世界 ✨</div>
            <div class="password-box" id="passwordBox">
                <div class="hint">请输入密码</div>
                <div class="digit-row">
                    <span class="digit-prefix">26.</span>
                    <input type="text" class="digit-input" id="d0" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" class="digit-input" id="d1" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <span class="digit-prefix" style="color:rgba(210,71,135,0.5)">.</span>
                    <input type="text" class="digit-input" id="d2" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" class="digit-input" id="d3" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                </div>
                <div class="error" id="pwError">不对哦</div>
            </div>
        </div>
    </div>

    <script>
        const herQuotes = [
            "宝宝真好，你太会撩人了(*≧ω≦)",
            "能拥有一个这么好的男朋友谁的嘴角能压得下来啊",
            "想就这样跟你待在一起😭",
            "如果要在一起，希望是一辈子，不是嘴上说说",
            "意识到自己喜欢你时，想给自己两巴掌",
            "别的宝宝有的我的宝宝一样不能少",
            "你是最好的宝宝",
            "谢谢宝宝，特别爱你",
            "我真的太喜欢你的全部了",
            "好喜欢你现在已经不求回报了",
            "我只是想陪你",
            "和你在一起一定会很幸福的吧",
            "我们还有数不完的24h可以陪在一起",
            "你干啥都招我喜欢",
            "以后你跟我在一起，你干什么我都支持你",
            "我很喜欢你",
            "我喜欢你",
            "但这是我男朋友啊 怎么感觉你干啥都招我喜欢",
            "和你在一起每天都有惊喜每天都有好玩的",
            "很多人说距离太远根本不适合在一起 而你却说这么远的距离我们都能有缘相遇",
            "可以和你住在一起吗",
            "只要能陪你这都不算事",
            "谈了个超厉害的男朋友",
            "你一万年才认识几个人，然后天天幻想着有一天会有一个皮肤白，娇小可爱，温柔，善良，懂事，善解人意，能陪我一起打游戏，能跟我一块吃吃喝喝吃到一块去的，还能陪我一起看电影，还能和我天天熬夜聊天的女孩从天而降",
        ];

        const himQuotes = [
            "已经想你了怎么办",
            "我好喜欢你",
            "要一直一直在一起哦",
            "我爱你哦宝宝",
            "怎么会呢，你这么温柔善良可爱",
            "越来越喜欢你了",
            "喜欢你嘛，怎么样都可以的",
            "闲下来就会想你在干什么",
            "我爱你",
            "好想你，还等着你来玩游戏呢",
            "嘿嘿，和你在一起每天都有惊喜",
            "我老婆是金光",
            "光叫老婆媳妇就已经很心满意足了",
            "谈恋爱就是要找会和自己在一起一辈子的人",
            "我妈肯定会特别喜欢你的",
            "就是喜欢你嘛",
            "我喜欢你",
            "我也想你",
            "老是想你",
            "怎么会呢，完全不用担心有人会不喜欢你吧",
            "好喜欢你",
            "早安老婆大人",
            "要一直一直在一起哦",
            "嘿嘿，我就是喜欢这么可爱的你",
        ];

        function buildDanmaku() {
            const layer = document.getElementById('danmakuLayer');
            const allCards = [
                ...herQuotes.map(t => ({ text: t, type: 'her' })),
                ...himQuotes.map(t => ({ text: t, type: 'him' })),
            ];
            function shuffle(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }
            for (let t = 0; t < 8; t++) {
                const track = document.createElement('div');
                track.className = `danmaku-track track-${(t % 8) + 1} ${t % 2 === 0 ? 'track-left' : 'track-right'}`;
                track.style.top = `${(t / 8) * 100}%`;
                track.style.animationDelay = `${Math.random() * -50}s`;

                const shuffled = shuffle(allCards);
                const doubled = [...shuffled, ...shuffled];
                for (const card of doubled.slice(0, 16)) {
                    const el = document.createElement('div');
                    el.className = `card ${card.type}`;
                    el.style.animationDelay = `${Math.random() * 3}s`;
                    el.textContent = card.text;
                    track.appendChild(el);
                }
                layer.appendChild(track);
            }
        }

        const holdBtn = document.getElementById('holdBtn');
        const btnFill = document.getElementById('btnFill');
        const landing = document.getElementById('landing');
        const mainArea = document.getElementById('mainArea');
        const welcomeText = document.getElementById('welcomeText');
        const passwordBox = document.getElementById('passwordBox');
        const danmakuLayer = document.getElementById('danmakuLayer');
        const pwError = document.getElementById('pwError');
        const pathLeft = document.getElementById('pathLeft');
        const pathRight = document.getElementById('pathRight');

        const lenLeft = pathLeft.getTotalLength();
        const lenRight = pathRight.getTotalLength();
        pathLeft.style.strokeDasharray = lenLeft;
        pathLeft.style.strokeDashoffset = lenLeft;
        pathRight.style.strokeDasharray = lenRight;
        pathRight.style.strokeDashoffset = lenRight;

        let progress = 0;
        const holdDuration = 2000;
        let isHolding = false;
        let isCompleted = false;

        function startHold() {
            if (isCompleted) return;
            isHolding = true;
            const startTime = Date.now();
            const startProgress = progress;
            function animate() {
                if (!isHolding) {
                    progress = Math.max(0, progress - 0.025);
                    updateAll();
                    if (progress > 0) requestAnimationFrame(animate);
                    return;
                }
                const elapsed = Date.now() - startTime;
                progress = Math.min(1, startProgress + elapsed / holdDuration);
                updateAll();
                if (progress >= 1) {
                    isCompleted = true;
                    enterMain();
                    return;
                }
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }
        function endHold() { isHolding = false; }
        function updateAll() {
            pathLeft.style.strokeDashoffset = lenLeft * (1 - progress);
            pathRight.style.strokeDashoffset = lenRight * (1 - progress);
            btnFill.style.width = (progress * 100) + '%';
            holdBtn.style.color = progress > 0.5 ? '#fff' : '#ff69b4';
        }

        function enterMain() {
            document.body.classList.add('light-bg');
            buildDanmaku();
            setTimeout(() => {
                landing.classList.add('slide-up');
                mainArea.classList.add('active');
                welcomeText.classList.remove('hidden');

                setTimeout(() => {
                    welcomeText.classList.add('hidden');
                    danmakuLayer.classList.add('visible');

                    setTimeout(() => {
                        passwordBox.classList.add('visible');
                        d0.focus();
                    }, 1500);
                }, 2500);
            }, 400);
        }

        // ===== 密码：26._ _._ _ =====
        const d0 = document.getElementById('d0');
        const d1 = document.getElementById('d1');
        const d2 = document.getElementById('d2');
        const d3 = document.getElementById('d3');
        const allDigits = [d0, d1, d2, d3];

        allDigits.forEach((el, i) => {
            el.addEventListener('input', () => {
                el.value = el.value.replace(/\D/g, '');
                if (el.value.length === 1 && i < 3) allDigits[i + 1].focus();
                if (allDigits.every(d => d.value.trim() !== '')) checkPw();
            });
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && el.value === '' && i > 0) allDigits[i - 1].focus();
                if (e.key === 'Enter') checkPw();
            });
        });

        let secretPw = '';
        fetch('secret.txt')
            .then(r => r.text())
            .then(s => { secretPw = s.trim(); })
            .catch(() => {});

        function checkPw() {
            const entered = '26' + allDigits.map(d => d.value.trim()).join('');
            if (entered.length === 6 && entered === secretPw) {
                sessionStorage.setItem('unlocked', '1');
                window.location.href = 'inside.html';
            } else if (entered.length === 6) {
                pwError.classList.add('show');
                setTimeout(() => pwError.classList.remove('show'), 1200);
                allDigits.forEach(d => d.value = '');
                d0.focus();
            }
        }

        holdBtn.addEventListener('mousedown', startHold);
        holdBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startHold();
        });
        document.addEventListener('mouseup', endHold);
        document.addEventListener('touchend', endHold);
        document.addEventListener('mouseleave', endHold);
    </script>

</body>
</html>

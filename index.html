<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
            transition: background-color 1.2s ease;
            background: #000;
        }

        .black-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 20px;
            transition: transform 1.2s ease-in-out;
        }

        /* 合照 */
        .game-photo {
            width: 85%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.2);
        }

        /* 情头 + 爱心 */
        .avatar-heart-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .avatar-wrap {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ff69b4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
            overflow: hidden;
            z-index: 2;
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* SVG 爱心 */
        .heart-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 280px;
            z-index: 1;
            pointer-events: none;
        }
        .heart-path {
            fill: none;
            stroke: #ff69b4;
            stroke-width: 3;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.8));
        }

        /* 长按按钮 */
        .hold-btn {
            padding: 16px 48px;
            border: 2px solid #ff69b4;
            background: transparent;
            color: #ff69b4;
            font-size: 17px;
            border-radius: 50px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            animation: breathe 2s ease-in-out infinite;
        }
        .hold-btn:active {
            background: rgba(255, 105, 180, 0.2);
            transform: scale(0.96);
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 105, 180, 0.4); }
            50% { box-shadow: 0 0 28px rgba(255, 105, 180, 0.9); }
        }

        /* 转场 */
        .slide-up {
            transform: translateY(-100%);
        }
        body.light-bg {
            background: #fff0f5;
        }

        /* 主页 */
        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d14787;
            font-size: 24px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.8s ease 0.5s;
            pointer-events: none;
        }
        .main-page.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="black-wrap" id="blackWrap">

        <img src="合照.jpg" alt="合照" class="game-photo">

        <div class="avatar-heart-box">
            <div class="avatar-wrap">
                <img src="左情头.jpg" alt="左边情头" class="avatar">
            </div>

            <svg class="heart-svg" viewBox="0 0 240 220">
                <path class="heart-path" id="pathLeft"
                      d="M 120 60 C 60 0, 0 25, 0 85 C 0 145, 70 175, 120 210" />
                <path class="heart-path" id="pathRight"
                      d="M 120 60 C 180 0, 240 25, 240 85 C 240 145, 170 175, 120 210" />
            </svg>

            <div class="avatar-wrap">
                <img src="右情头.jpg" alt="右边情头" class="avatar">
            </div>
        </div>

        <button class="hold-btn" id="holdBtn">长按进入</button>
    </div>

    <div class="main-page" id="mainPage">
        欢迎来到我们的小世界 ✨
    </div>

    <script>
        const holdBtn = document.getElementById('holdBtn');
        const blackWrap = document.getElementById('blackWrap');
        const mainPage = document.getElementById('mainPage');
        const pathLeft = document.getElementById('pathLeft');
        const pathRight = document.getElementById('pathRight');

        const lenLeft = pathLeft.getTotalLength();
        const lenRight = pathRight.getTotalLength();
        pathLeft.style.strokeDasharray = lenLeft;
        pathLeft.style.strokeDashoffset = lenLeft;
        pathRight.style.strokeDasharray = lenRight;
        pathRight.style.strokeDashoffset = lenRight;

        let progress = 0;
        const holdDuration = 2000;
        let isHolding = false;
        let isCompleted = false;

        function startHold() {
            if (isCompleted) return;
            isHolding = true;
            const startTime = Date.now();
            const startProgress = progress;

            function animate() {
                if (!isHolding) {
                    progress = Math.max(0, progress - 0.03);
                    updateLine();
                    if (progress > 0) requestAnimationFrame(animate);
                    return;
                }
                const elapsed = Date.now() - startTime;
                progress = Math.min(1, startProgress + elapsed / holdDuration);
                updateLine();
                if (progress >= 1) {
                    isCompleted = true;
                    enterMain();
                    return;
                }
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }

        function endHold() {
            isHolding = false;
        }

        function updateLine() {
            pathLeft.style.strokeDashoffset = lenLeft * (1 - progress);
            pathRight.style.strokeDashoffset = lenRight * (1 - progress);
        }

        function enterMain() {
            document.body.classList.add('light-bg');
            setTimeout(() => {
                blackWrap.classList.add('slide-up');
                mainPage.classList.add('show');
            }, 400);
        }

        holdBtn.addEventListener('mousedown', startHold);
        holdBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startHold();
        });
        document.addEventListener('mouseup', endHold);
        document.addEventListener('touchend', endHold);
        document.addEventListener('mouseleave', endHold);
    </script>

</body>
</html>

        .center-avatar:active { transform: translate(-50%,-50%) scale(1.05); }

            50% { box-shadow: 0 0 55px rgba(255,215,0,0.6), 0 0 100px rgba(255,105,180,0.40); }

        // 大标签点击
        big1.addEventListener('click', () => {
            detailTitle.textContent = '想对宝宝说的话';
            detailContent.innerHTML = wordsContent;
            detailOverlay.classList.add('show');
        });
        big1.addEventListener('touchend', (e) => {
            if (dragMoved) return;
            e.preventDefault();
            detailTitle.textContent = '想对宝宝说的话';
            detailContent.innerHTML = wordsContent;
            detailOverlay.classList.add('show');
        });

        big2.addEventListener('click', () => {
            detailTitle.textContent = '爱玲宝的100个理由';
            detailContent.innerHTML = reasonsContent;
            detailOverlay.classList.add('show');
        });
        big2.addEventListener('touchend', (e) => {
            if (dragMoved) return;
            e.preventDefault();
            detailTitle.textContent = '爱玲宝的100个理由';
            detailContent.innerHTML = reasonsContent;
            detailOverlay.classList.add('show');
        });

        // 小气泡点击
        smallBubbles.forEach(b => {
            const imgFile = b.getAttribute('data-img');
            b.addEventListener('click', () => {
                popupImg.src = imgFile;
                imageOverlay.classList.add('show');
            });
            b.addEventListener('touchend', (e) => {
                if (dragMoved) return;
                e.preventDefault();
                popupImg.src = imgFile;
                imageOverlay.classList.add('show');
            });
        });

        // 关闭弹层
        imgCloseBtn.addEventListener('click', () => {
            imageOverlay.classList.remove('show');
        });
        imageOverlay.addEventListener('click', (e) => {
            if (e.target === imageOverlay) imageOverlay.classList.remove('show');
        });

        detailCloseBtn.addEventListener('click', () => {
            detailOverlay.classList.remove('show');
        });
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) detailOverlay.classList.remove('show');
        });

        // ===== 拖动旋转 =====
        let rotationAngle = 0;
        const bigBubblesArr = [big1, big2];
        const bigRadius = 140;
        const bigStartDegrees = [300, 120];

        const smallBubbleArr = Array.from(smallBubbles);
        const smallRadius = 230;

        function updatePositions() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const rad = rotationAngle;

            bigBubblesArr.forEach((el, i) => {
                const deg = bigStartDegrees[i] + (rad * 180 / Math.PI);
                const a = deg * Math.PI / 180;
                const x = cx + bigRadius * Math.cos(a);
                const y = cy + bigRadius * Math.sin(a);
                const w = el.offsetWidth;
                const h = el.offsetHeight;
                if (w > 0) {
                    el.style.left = (x - w / 2) + 'px';
                    el.style.top = (y - h / 2) + 'px';
                }
            });

            smallBubbleArr.forEach((el, i) => {
                const deg = (360 / smallBubbleArr.length) * i + (rad * 180 / Math.PI);
                const a = deg * Math.PI / 180;
                const x = cx + smallRadius * Math.cos(a);
                const y = cy + smallRadius * Math.sin(a);
                const w = el.offsetWidth;
                if (w > 0) {
                    el.style.left = (x - w / 2) + 'px';
                    el.style.top = (y - w / 2) + 'px';
                }
            });
        }

        // 延迟初始化，等元素渲染完
        let positionsReady = false;
        function initPositions() {
            updatePositions();
            if (!positionsReady) {
                positionsReady = true;
                // 再等一帧确保 offsetWidth 准确
                requestAnimationFrame(() => {
                    updatePositions();
                });
            }
        }
        setTimeout(initPositions, 100);
        window.addEventListener('load', () => {
            setTimeout(updatePositions, 150);
        });

        // 拖动逻辑 —— 加阈值区分点击和拖动
        let isDragging = false;
        let dragMoved = false;
        let lastY = 0;
        let momentum = 0;
        const DRAG_THRESHOLD = 5; // 移动超过 5px 才算拖动

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragMoved = false;
            lastY = e.clientY;
            momentum = 0;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dy = e.clientY - lastY;
            if (!dragMoved && Math.abs(dy) > DRAG_THRESHOLD) dragMoved = true;
            if (dragMoved) {
                lastY = e.clientY;
                momentum = dy * 0.005;
                rotationAngle += momentum;
                updatePositions();
            }
        });
        window.addEventListener('mouseup', () => {
            isDragging = false;
            setTimeout(() => { dragMoved = false; }, 50);
        });

        // 触摸拖动
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                dragMoved = false;
                lastY = e.touches[0].clientY;
                momentum = 0;
            }
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dy = e.touches[0].clientY - lastY;
            if (!dragMoved && Math.abs(dy) > DRAG_THRESHOLD) {
                dragMoved = true;
            }
            if (dragMoved) {
                e.preventDefault();
                lastY = e.touches[0].clientY;
                momentum = dy * 0.005;
                rotationAngle += momentum;
                updatePositions();
            }
        }, { passive: false });
        window.addEventListener('touchend', () => {
            isDragging = false;
            setTimeout(() => { dragMoved = false; }, 50);
        });

        // 惯性衰减
        function inertiaLoop() {
            if (!isDragging && Math.abs(momentum) > 0.0003) {
                momentum *= 0.94;
                rotationAngle += momentum;
                updatePositions();
            }
            requestAnimationFrame(inertiaLoop);
        }
        requestAnimationFrame(inertiaLoop);

        window.addEventListener('resize', () => {
            requestAnimationFrame(updatePositions);
            setTimeout(updatePositions, 200);
        });
    </script>
